# ===========================================================================
# application.properties — Configuración de la aplicación Spring Boot
# ===========================================================================
# Este archivo centraliza toda la configuración del backend.
# Spring Boot lo lee automáticamente al arrancar.

# --- Nombre y puerto de la aplicación ---
spring.application.name=interview-back
server.port=${PORT:8080}

# ===========================================================================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL)
# ===========================================================================

# URL de conexión JDBC parametrizada con variables de entorno (con fallback local):
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/interviewai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# Credenciales de MySQL parametrizadas:
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Driver JDBC de MySQL 8+
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================================================
# CONFIGURACIÓN DEL POOL DE CONEXIONES HIKARICP
# ===========================================================================
# Nombre identificatorio del pool en logs y métricas
spring.datasource.hikari.pool-name=InterviewHikariPool
# Cantidad máxima de conexiones en el pool (óptimo para contenedores con recursos acotados en Azure)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
# Conexiones mínimas inactivas mantenidas vivas
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
# Tiempo máximo (ms) de espera por una conexión antes de fallar (20 segundos)
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
# Tiempo máximo (ms) de inactividad antes de liberar una conexión excedente (5 minutos)
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
# Vida útil máxima (ms) de una conexión para prevenir stale TCP connections (20 minutos)
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1200000}
# Umbral (ms) para detectar y loguear fugas de conexiones no cerradas (30 segundos)
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD:30000}

# ===========================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===========================================================================

# ddl-auto configurable: por defecto update en local, validate o none en producción
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Muestra las queries SQL generadas por Hibernate en la consola.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# Deshabilitar Open-In-View para API REST (buena práctica: no abrir transacciones innecesarias en vistas)
spring.jpa.open-in-view=false

# ===========================================================================
# CONFIGURACIÓN JWT
# ===========================================================================

# Clave secreta para firmar tokens JWT con HS256 (mínimo 256 bits).
jwt.secret=${JWT_SECRET:interview-app-super-secret-key-2024-change-in-production}

# Tiempo de expiración del token: 7 días en milisegundos (configurable)
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ===========================================================================
# CONFIGURACIÓN DE GROQ AI (groq.com)
# ===========================================================================
# Groq es una plataforma de inferencia rápida compatible con la API de OpenAI.
# Consola y API keys gratuitas en: https://console.groq.com
#
# La API key se lee de la variable de entorno GROQ_API_KEY.
# ⚠️  NUNCA hardcodees la API key en este archivo.
# ⚠️  Configurá la variable de entorno antes de correr el backend:
#
#   PowerShell (sesión actual):
#     $env:GROQ_API_KEY = "gsk_tu_api_key_aqui"
#
#   IntelliJ IDEA:
#     Run/Debug Configurations → Environment variables → GROQ_API_KEY=gsk_...
#
# Si GROQ_API_KEY no está definida, el servicio devuelve un feedback de fallback.
groq.api-key=${GROQ_API_KEY:NOT_CONFIGURED}

# ===========================================================================
# CONFIGURACIÓN DE ACTUATOR & OBSERVABILIDAD
# ===========================================================================
# Endpoints expuestos por HTTP. Los tres son de solo lectura:
#   health  → estado de la aplicación y sus dependencias
#   info    → información de build (versión, fecha)
#   metrics → métricas de Micrometer (JVM, HTTP, pool de conexiones)
management.endpoints.web.exposure.include=health,info,metrics

# SEGURIDAD — los DETALLES del estado de salud no se exponen públicamente.
#   Sin token:  {"status":"UP"}                       ← solo el estado
#   Con token:  {"status":"UP","components":{...}}    ← detalle completo
#
# Antes estaba en "always", lo que publicaba sin autenticación el motor de
# base de datos, el espacio en disco del contenedor y la estructura interna
# de la aplicación. Es información que le sirve a un atacante para preparar
# un ataque y no aporta nada a un usuario anónimo.
#
# El endpoint en sí sigue siendo público a propósito: lo consultan el
# pipeline de despliegue y las sondas (probes) de Azure Container Apps.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

# Rol necesario para ver el detalle. Coincide con la autoridad ROLE_USER que
# asignan tanto el UserDetailsService (login) como el JwtAuthFilter (token).
management.endpoint.health.roles=USER

# Habilita /actuator/health/liveness y /actuator/health/readiness, que son
# los endpoints que usa Azure Container Apps para saber si el contenedor
# arrancó (liveness) y si está listo para recibir tráfico (readiness).
management.endpoint.health.probes.enabled=true

# Etiqueta común a todas las métricas: permite identificarlas en Azure Monitor
# cuando hay más de una aplicación enviando datos.
management.metrics.tags.application=interview-backend

# Publica la información de build en /actuator/info (versión y fecha).
# El archivo se genera con la tarea buildInfo() de Gradle.
management.info.build.enabled=true
