# ===========================================================================
# Configuración del backend
# ===========================================================================
# Todos los valores se pueden sobreescribir con variables de entorno: la
# sintaxis ${VARIABLE:valor_por_defecto} usa el valor por defecto cuando la
# variable no está definida. Los secretos reales no se guardan en este archivo.

spring.application.name=interview-back
server.port=${PORT:8080}

# --- Base de datos ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/interviewai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Pool de conexiones HikariCP ---
spring.datasource.hikari.pool-name=InterviewHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
# Renueva las conexiones antes de que la base las cierre por inactividad.
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1200000}
# Registra en el log las conexiones que no se devuelven al pool.
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD:30000}

# --- JPA / Hibernate ---
# update crea y actualiza el esquema a partir de las entidades. Con migraciones
# versionadas (Flyway) correspondería validate.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
# Evita mantener abierta una sesión de Hibernate durante la serialización.
spring.jpa.open-in-view=false

# --- JWT ---
# Clave de firma (HMAC-SHA). Obligatoria y sin valor por defecto: la aplicación
# no arranca si falta, en vez de firmar con una clave conocida. Mínimo 32 bytes;
# a partir de 48, jjwt usa HS384. Ver README para definirla en desarrollo.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# --- Groq AI ---
# Sin clave configurada, el servicio devuelve respuestas de fallback.
groq.api-key=${GROQ_API_KEY:NOT_CONFIGURED}

# --- CORS ---
# Orígenes autorizados separados por coma. Restringir con CORS_ALLOWED_ORIGINS
# cuando exista un cliente web.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics

# Sin token, /actuator/health informa solo el estado; el detalle de los
# componentes requiere un token con este rol. El endpoint sigue siendo público
# porque lo consultan las sondas de Azure y el pipeline de despliegue.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=USER

# Sondas de vida y de preparación que usa Azure Container Apps.
management.endpoint.health.probes.enabled=true

management.metrics.tags.application=interview-backend
management.info.build.enabled=true
